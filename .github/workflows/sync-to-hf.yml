name: Sync Backend to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Push backend folder to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # ⚠️ Change this to your actual Hugging Face username!
          HF_USERNAME: "tahanawab4848" 
          SPACE_NAME: "pathoglow-backend"
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Action Sync"
          
          # Clone the HF space
          git clone https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$SPACE_NAME hf-space
          
          # Copy backend files into the HF space
          cp -r backend/* hf-space/
          
          # Commit and push
          cd hf-space
          git add .
          git commit -m "Auto-sync from GitHub" || echo "No changes to commit"
          git push
